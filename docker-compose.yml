x-app-environment: &app-environment
  TZ: "${TZ}"

  IMAP_HOST: "${IMAP_HOST}"
  IMAP_PORT: "${IMAP_PORT}"
  IMAP_SSL: "${IMAP_SSL}"
  IMAP_USERNAME: "${IMAP_USERNAME}"
  IMAP_PASSWORD: "${IMAP_PASSWORD}"
  IMAP_FOLDER: "${IMAP_FOLDER}"
  IMAP_FROM_CONTAINS: "${IMAP_FROM_CONTAINS}"
  IMAP_LOOKBACK_DAYS: "${IMAP_LOOKBACK_DAYS}"

  SMTP_HOST: "${SMTP_HOST}"
  SMTP_PORT: "${SMTP_PORT}"
  SMTP_MODE: "${SMTP_MODE}"
  SMTP_USERNAME: "${SMTP_USERNAME}"
  SMTP_PASSWORD: "${SMTP_PASSWORD}"
  SMTP_FROM_EMAIL: "${SMTP_FROM_EMAIL}"
  SMTP_FROM_NAME: "${SMTP_FROM_NAME}"

  WORKER_HASH_SECRET: "${WORKER_HASH_SECRET}"
  BACKUP_PATH: "/backups"

  INDIGO_ENABLED: "${INDIGO_ENABLED}"
  INDIGO_DB_HOST: "${INDIGO_DB_HOST}"
  INDIGO_DB_PORT: "${INDIGO_DB_PORT}"
  INDIGO_DB_NAME: "${INDIGO_DB_NAME}"
  INDIGO_DB_USER: "${INDIGO_DB_USER}"
  INDIGO_DB_PASSWORD: "${INDIGO_DB_PASSWORD}"
  INDIGO_DB_SSLMODE: "${INDIGO_DB_SSLMODE}"
  INDIGO_DB_CONNECT_TIMEOUT: "${INDIGO_DB_CONNECT_TIMEOUT}"

  ADMIN_USERNAME: "${ADMIN_USERNAME}"
  ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
  ADMIN_DISPLAY_NAME: "${ADMIN_DISPLAY_NAME:-}"
  SESSION_SECRET: "${SESSION_SECRET}"
  SESSION_MAX_AGE_SECONDS: "${SESSION_MAX_AGE_SECONDS:-28800}"
  SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-false}"

x-app-volumes: &app-volumes
  - "${STORAGE_ROOT}/data:/opt/invite-mailer/data"
  - "${STORAGE_ROOT}/state:/opt/invite-mailer/state"
  - "${STORAGE_ROOT}/reports:/opt/invite-mailer/reports"
  - "${BACKUP_ROOT:-/opt/invite-mailer-backups}:/backups"

services:
  invite-mailer:
    build: .
    container_name: invite-mailer
    restart: unless-stopped
    environment: *app-environment
    volumes: *app-volumes
    networks:
      - invite-mailer-net

  invite-mailer-admin:
    build: .
    container_name: invite-mailer-admin
    restart: unless-stopped
    command: ["uvicorn", "app.admin_web_v280:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *app-environment
    volumes: *app-volumes
    networks:
      - invite-mailer-net

  report-web:
    build: ./nginx
    container_name: invite-mailer-report
    restart: unless-stopped
    depends_on:
      - invite-mailer
      - invite-mailer-admin
    ports:
      - "${REPORT_BIND_IP}:${REPORT_PORT}:80"
    volumes:
      - "${STORAGE_ROOT}/reports:/usr/share/nginx/html:ro"
    networks:
      - invite-mailer-net

networks:
  invite-mailer-net:
    driver: bridge
