templates:
  - id: "intro_tests"
    enabled: false
    name: "Вводное тестирование"
    subject: "Приглашение к прохождению тестирования"
    body_template: "/opt/invite-mailer/templates/intro_tests.html"

    # once – один раз в рамках текущего периода работы.
    # periodic – повторно после validity_days.
    mode: "once"
    validity_days: null

    departments:
      include:
        - "*"
      exclude: []

# Антитеррор
  - id: "antiterror"
    enabled: false
    name: "Антитеррор"
    subject: "Обязательное прохождение курса и тестирования по антитеррористической безопасности"
    body_template: "/opt/invite-mailer/templates/antiterror.html"
    mode: "once"
    validity_days: null

    departments:
      include:
        - "*"
      exclude: []