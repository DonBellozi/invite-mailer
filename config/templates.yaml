templates:
  # Антитеррор – все действующие сотрудники
  - id: "antiterror"
    enabled: true
    name: "Антитеррор"
    subject: "Обязательное прохождение курса и тестирования по антитеррористической безопасности"
    body_template: "/opt/invite-mailer/templates/antiterror.html"
    mode: "once"
    validity_days: null

    departments:
      include:
        - "*"
      exclude: []

    indigo:
      logical_test_id: 1715
      test_name: "Антитеррор"
      success_results:
        - "Отлично"
        - "Хорошо"
      failed_result_prefixes:
        - "Требуется повторный"

  # Антикоррупция – выборочный список участников
  - id: "anticorruption"
    enabled: true
    name: "Антикоррупция"
    subject: "Обязательное прохождение тренинга и тестирования по антикоррупционной безопасности"
    body_template: "/opt/invite-mailer/templates/anticorruption.html"
    mode: "once"
    validity_days: null

    audience:
      type: "explicit_list"

    indigo:
      logical_test_id: 1719
      test_name: "Антикоррупция"
      success_results:
        - "Отлично"
        - "Хорошо"
      failed_result_prefixes:
        - "Требуется повторный"
